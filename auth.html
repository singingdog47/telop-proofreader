<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ログイン | 映像テロップ校閲システム</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="panel auth-card">
      <h1>映像テロップ校閲システム</h1>
      <p class="hint">共有Web版</p>

      <div id="configWarning" class="system-message error hidden"></div>
      <div id="authMessage" class="system-message hidden"></div>

      <div class="auth-tabs">
        <button id="showLogin" class="tab active">ログイン</button>
        <button id="showSignup" class="tab">新規登録</button>
      </div>

      <form id="loginForm">
        <label>メールアドレス
          <input id="loginEmail" type="email" autocomplete="email" required />
        </label>
        <label>パスワード
          <input id="loginPassword" type="password" autocomplete="current-password" required minlength="6" />
        </label>
        <button class="primary full" type="submit">ログイン</button>
      </form>

      <form id="signupForm" class="hidden">
        <label>表示名
          <input id="signupName" type="text" required maxlength="40" placeholder="例：小林" />
        </label>
        <label>メールアドレス
          <input id="signupEmail" type="email" autocomplete="email" required />
        </label>
        <label>パスワード
          <input id="signupPassword" type="password" autocomplete="new-password" required minlength="6" />
        </label>
        <button class="primary full" type="submit">アカウントを作成</button>
        <p class="hint">最初に登録したユーザーが管理者になります。2人目以降は運用者として登録されます。</p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./src/config.js"></script>
  <script src="./src/backend.js"></script>
  <script src="./src/auth.js"></script>
</body>
</html>
